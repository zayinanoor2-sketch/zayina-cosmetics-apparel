<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayina Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin Panel basic container styling jo aapke design ke sath match kare */
        body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
        .admin-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #000; color: #fff; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #333; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Zayina Admin Panel - Add Product</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="product-name">Product Name:</label>
                <input type="text" id="product-name" required>
            </div>
            <div class="form-group">
                <label for="product-price">Price (Rs.):</label>
                <input type="number" id="product-price" required>
            </div>
            <div class="form-group">
                <label for="product-desc">Description:</label>
                <textarea id="product-desc" rows="3"></textarea>
            </div>
            <button type="submit" id="save-btn">Add Product (Real-Time)</button>
        </form>
    </div>

    <!-- Firebase Connection & Add Product Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Yahan wahi apni Firebase credentials dalein jo aapne index.html mein dali thin
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("product-form");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const name = document.getElementById("product-name").value;
            const price = document.getElementById("product-price").value;
            const description = document.getElementById("product-desc").value;
            const btn = document.getElementById("save-btn");

            try {
                btn.textContent = "Saving...";
                // Firestore mein product save hoga jo foran customer wali screen par live show ho jayega
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    description: description,
                    createdAt: new Date()
                });

                alert("Product successfully added and synced live!");
                form.reset();
            } catch (error) {
                console.error("Error adding product: ", error);
                alert("Error adding product. Check console.");
            } finally {
                btn.textContent = "Add Product (Real-Time)";
            }
        });
    </script>
</body>
</html>
